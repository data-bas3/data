 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saab Alaya - Song Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --accent:#e63946;
    --accent2:#3bb6ff;
    --text:#f1f1f1;
    --muted:#9aa0aa;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Roboto', sans-serif;
    background:linear-gradient(160deg,#0f1115,#1b1e27);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px 60px;
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  h1{
    font-weight:500;
    font-size:1.6rem;
    text-align:center;
    margin-bottom:4px;
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:0.9rem;
    margin-bottom:24px;
  }
  .player-card{
    background:var(--card);
    border-radius:14px;
    padding:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    margin-bottom:24px;
  }
  .video-frame{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:10px;
    overflow:hidden;
    background:#000;
  }
  #player{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
  }
  .thumb-overlay{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
  }
  .thumb-overlay img{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .thumb-play-btn{
    position:relative;
    width:74px;
    height:74px;
    border-radius:50%;
    background:rgba(230,57,70,0.9);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.8rem;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
    transition:transform .15s ease;
  }
  .thumb-overlay:hover .thumb-play-btn{
    transform:scale(1.08);
  }
  .thumb-overlay.hidden{
    display:none;
  }
  .thumb-fallback{
    display:none;
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    background:#1c2029;
    color:var(--muted);
    font-size:0.9rem;
    cursor:pointer;
    z-index:4;
  }
  .thumb-fallback.hidden{
    display:none !important;
  }
  .now-playing{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
    font-size:0.95rem;
  }
  .now-playing .label{
    color:var(--muted);
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    display:block;
    margin-bottom:2px;
  }
  .now-playing .title{
    font-weight:500;
    font-size:1.1rem;
  }
  .controls{
    display:flex;
    gap:10px;
  }
  button{
    font-family:'Roboto', sans-serif;
    border:none;
    background:var(--accent);
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    font-size:0.85rem;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  button.secondary{
    background:#2a2e38;
    color:var(--text);
  }
  button:hover{ transform:translateY(-1px); }
  button:active{ transform:translateY(0); }

  .progress-outer{
    margin-top:12px;
    height:6px;
    width:100%;
    background:#2a2e38;
    border-radius:4px;
    overflow:hidden;
  }
  .progress-inner{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .25s linear;
  }

  .playlist{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .track{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid transparent;
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .track:hover{
    border-color:#333a47;
  }
  .track.active{
    border-color:var(--accent);
    background:#1f232d;
  }
  .track-index{
    width:30px;
    height:30px;
    flex:0 0 30px;
    border-radius:50%;
    background:#2a2e38;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.85rem;
    color:var(--muted);
  }
  .track.active .track-index{
    background:var(--accent);
    color:#fff;
  }
  .track-info{
    flex:1;
  }
  .track-title{
    font-size:1rem;
    font-weight:500;
  }
  .track-time{
    font-size:0.78rem;
    color:var(--muted);
    margin-top:2px;
  }
  .track-play-icon{
    font-size:1.2rem;
    color:var(--muted);
  }
  .track.active .track-play-icon{
    color:var(--accent2);
  }
  .footer-note{
    text-align:center;
    color:var(--muted);
    font-size:0.78rem;
    margin-top:26px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 Saab Alaya — Song Playlist</h1>
  <div class="subtitle">Four clips pulled from one long video, played back to back</div>

  <div class="player-card">
    <div class="video-frame">
      <div id="player"></div>
      <div id="thumbOverlay" class="thumb-overlay">
        <img src="https://data-bas3.github.io/data/Rhany.png" alt="Video thumbnail" referrerpolicy="no-referrer" crossorigin="anonymous" onerror="this.style.display='none'; document.getElementById('thumbFallback').style.display='flex';" />
        <div class="thumb-play-btn">▶</div>
      </div>
      <div id="thumbFallback" class="thumb-fallback">
        Thumbnail image failed to load — click here to play
      </div>
    </div>

    <div class="now-playing">
      <div>
        <span class="label">Now playing</span>
        <span class="title" id="nowPlayingTitle">Press play to start</span>
      </div>
      <div class="controls">
        <button class="secondary" id="prevBtn">⏮ Prev</button>
        <button id="playPauseBtn">▶ Play</button>
        <button class="secondary" id="nextBtn">Next ⏭</button>
      </div>
    </div>

    <div class="progress-outer">
      <div class="progress-inner" id="progressBar"></div>
    </div>
  </div>

  <div class="playlist" id="playlist"></div>

  <div class="footer-note">Each song auto-stops at its marked end time and moves to the next one.</div>
</div>

<script>
  const VIDEO_ID = "KlY6ZJNXgcE";

  // Playlist: each entry has a title, start (sec) and end (sec)
  const playlist = [
    { title: "Saab Alaya",     start: 1333, end: 1549 },
    { title: "Khallouni",      start: 464,  end: 654  },
    { title: "Lakder",         start: 654,  end: 885  },
    { title: "Malakti Rohy",   start: 1062, end: 1333 }
  ];

  function fmt(sec){
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  // Build playlist UI
  const playlistEl = document.getElementById('playlist');
  playlist.forEach((track, i) => {
    const div = document.createElement('div');
    div.className = 'track';
    div.dataset.index = i;
    div.innerHTML = `
      <div class="track-index">${i+1}</div>
      <div class="track-info">
        <div class="track-title">${track.title}</div>
        <div class="track-time">${fmt(track.start)} – ${fmt(track.end)}</div>
      </div>
      <div class="track-play-icon">▶</div>
    `;
    div.addEventListener('click', () => playTrack(i));
    playlistEl.appendChild(div);
  });

  let player;
  let currentIndex = 0;
  let watcherInterval = null;
  let isPlayerReady = false;

  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function() {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      playerVars: {
        start: playlist[0].start,
        rel: 0,
        modestbranding: 1,
        playsinline: 1
      },
      events: {
        onReady: () => { isPlayerReady = true; },
        onStateChange: onPlayerStateChange
      }
    });
  };

  function highlightActive(){
    document.querySelectorAll('.track').forEach((el, i) => {
      el.classList.toggle('active', i === currentIndex);
    });
    document.getElementById('nowPlayingTitle').textContent = playlist[currentIndex].title;
  }

  function playTrack(index){
    if(!isPlayerReady) return;
    currentIndex = index;
    highlightActive();
    player.loadVideoById({
      videoId: VIDEO_ID,
      startSeconds: playlist[index].start,
      endSeconds: playlist[index].end
    });
    player.playVideo();
  }

  function onPlayerStateChange(event){
    if(event.data === YT.PlayerState.PLAYING){
      document.getElementById('playPauseBtn').textContent = '⏸ Pause';
      setThumbPlayingState(true);
      startWatcher();
    }
    if(event.data === YT.PlayerState.PAUSED){
      document.getElementById('playPauseBtn').textContent = '▶ Play';
      setThumbPlayingState(false);
    }
    if(event.data === YT.PlayerState.ENDED){
      goNext();
    }
  }

  function setThumbPlayingState(isPlaying){
    const overlay = document.getElementById('thumbOverlay');
    const playBtn = overlay.querySelector('.thumb-play-btn');
    if(isPlaying){
      playBtn.style.display = 'none';
      overlay.style.cursor = 'default';
    } else {
      playBtn.style.display = 'flex';
      overlay.style.cursor = 'pointer';
    }
  }

  function startWatcher(){
    clearInterval(watcherInterval);
    watcherInterval = setInterval(() => {
      if(!player || typeof player.getCurrentTime !== 'function') return;
      const track = playlist[currentIndex];
      const t = player.getCurrentTime();
      const pct = Math.min(100, Math.max(0, ((t - track.start) / (track.end - track.start)) * 100));
      document.getElementById('progressBar').style.width = pct + '%';

      if(t >= track.end - 0.15){
        goNext();
      }
    }, 250);
  }

  function goNext(){
    clearInterval(watcherInterval);
    if(currentIndex < playlist.length - 1){
      playTrack(currentIndex + 1);
    } else {
      player.pauseVideo();
      document.getElementById('playPauseBtn').textContent = '▶ Play';
      document.getElementById('nowPlayingTitle').textContent = 'Playlist finished';
      document.getElementById('progressBar').style.width = '0%';
    }
  }

  function goPrev(){
    clearInterval(watcherInterval);
    if(currentIndex > 0){
      playTrack(currentIndex - 1);
    } else {
      playTrack(0);
    }
  }

  document.getElementById('playPauseBtn').addEventListener('click', () => {
    if(!isPlayerReady) return;
    const state = player.getPlayerState();
    if(state === YT.PlayerState.PLAYING){
      player.pauseVideo();
    } else {
      if(state === -1 || state === YT.PlayerState.ENDED){
        playTrack(currentIndex);
      } else {
        player.playVideo();
      }
    }
  });

  document.getElementById('nextBtn').addEventListener('click', goNext);
  document.getElementById('prevBtn').addEventListener('click', goPrev);

  document.getElementById('thumbOverlay').addEventListener('click', () => {
    if(!isPlayerReady) return;
    const state = player.getPlayerState();
    if(state === YT.PlayerState.PLAYING){
      player.pauseVideo();
    } else if(state === YT.PlayerState.PAUSED){
      player.playVideo();
    } else {
      playTrack(currentIndex);
    }
  });
  document.getElementById('thumbFallback').addEventListener('click', () => {
    document.getElementById('thumbFallback').classList.add('hidden');
    playTrack(currentIndex);
  });

  function hideThumb(){
    document.getElementById('thumbOverlay').classList.add('hidden');
    document.getElementById('thumbFallback').classList.add('hidden');
  }

  highlightActive();
</script>
</body>
</html>
