<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#5d6673;--line:#dfe3e8;--acc:#d6232a;--ok:#1b7f4b;--okbg:#e6f4ec;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--card:#1a1d22;--ink:#eef0f3;--mute:#9aa3af;--line:#2b3037;--acc:#ff5057;--ok:#52d18c;--okbg:#17291f;--warn:#f0b24a}}
:root[data-theme="dark"]{--bg:#101215;--card:#1a1d22;--ink:#eef0f3;--mute:#9aa3af;--line:#2b3037;--acc:#ff5057;--ok:#52d18c;--okbg:#17291f;--warn:#f0b24a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0 0 6px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.row1{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin:6px 0 8px}
.tools{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{padding:10px 14px 40px;max-width:640px;margin:0 auto}
.how{font-size:14px;color:var(--mute);margin:4px 0 12px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:4px 6px 4px 4px}
li.done{background:var(--okbg);border-color:transparent}
li.done a{color:var(--mute);text-decoration:line-through}
li a{flex:1;min-width:0;display:block;padding:12px 8px;color:var(--ink);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
li a small{display:block;font-weight:400;color:var(--warn);font-size:12px}
li label{display:flex;align-items:center;justify-content:center;width:48px;height:48px;flex:none}
li input{width:26px;height:26px;accent-color:var(--ok)}
.hide{display:none}
</style></head><body>
<header>
<h1>Subscribe on your phone</h1>
<div class="bar"><i id="bar"></i></div>
<div class="row1"><span id="count"></span><button id="reset" type="button">Reset</button></div>
<div class="tools"><input id="q" type="search" placeholder="Search channels" aria-label="Search channels"><button id="next" class="p" type="button">Next one</button></div>
</header>
<main>
<p class="how">Tap a channel to open it in YouTube, press Subscribe, come back, and tick the box. "Next one" jumps to the first channel you haven't ticked.</p>
<ul id="list"></ul>
</main>
